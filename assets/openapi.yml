            - active
            - completed
        tenant_id:
          type: integer
          description: 'Tenant ID that this offer applies to'
          example: 1
        redemptions_count_limit:
          type: integer
          minimum: 1
          description: 'Maximum number of redemptions allowed for this offer'
          example: 1000
        budget_limit:
          type: number
          minimum: 0.01
          description: 'Maximum budget limit for this offer in currency units'
          example: 50000.00
        start_date:
          type: [string, 'null']
          format: date-time
        end_date:
          type: [string, 'null']
          format: date-time
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        cover_image:
          type: [object, 'null']
