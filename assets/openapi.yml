info:
  title: Teebay API
  description: The Backend API for Teebay
  version: "1.0"
  contact: {}
tags: []
servers: []
components:
  securitySchemes:
    bearer:
      scheme: bearer
      bearerFormat: JWT
      type: http
  schemas:
    EUserRole:
      type: string
      enum:
        - SUPER_USER
        - ADMIN
    TokenizedUser:
      type: object
      properties:
        id:
          type: number
          example: 1
        claimId:
          type: number
          example: 1
        claim:
          example: ADMIN
          allOf:
            - $ref: "#/components/schemas/EUserRole"
        userProfileId:
          type: number
          example: 1
        email:
          type: string
          example: user@example.com
      required:
        - id
        - claimId
        - claim
        - userProfileId
        - email
    UserProfileDto:
      type: object
      properties:
        firstName:
          type: string
          minLength: 2
          maxLength: 255
          example: John
        lastName:
          type: string
          minLength: 2
          maxLength: 255
          example: Doe
        roleId:
          type: number
          example: 1
      required:
        - firstName
        - lastName
        - roleId
    RegisterUserDto:
      type: object
      properties:
        email:
          type: string
          format: email
          example: user@example.com
        password:
          type: string
          minLength: 8
          example: password123
        userProfile:
          $ref: "#/components/schemas/UserProfileDto"
      required:
        - email
        - userProfile
    RoleResponse:
      type: object
      properties:
        id:
          type: number
          example: 1
        createdAt:
          format: date-time
          type: string
          example: "2024-01-15T12:00:00Z"
        updatedAt:
          format: date-time
          type: string
          example: "2024-01-15T12:00:00Z"
        name:
          type: string
          example: ADMIN
      required:
        - id
        - createdAt
        - updatedAt
        - name
    UserProfileResponse:
      type: object
      properties:
        id:
          type: number
          example: 1
        createdAt:
          format: date-time
          type: string
          example: "2024-01-15T12:00:00Z"
        updatedAt:
          format: date-time
          type: string
          example: "2024-01-15T12:00:00Z"
        firstName:
          type: string
          example: John
        lastName:
          type: string
          example: Doe
        email:
          type: string
          example: john.doe@example.com
        role:
          $ref: "#/components/schemas/RoleResponse"
      required:
        - id
        - createdAt
        - updatedAt
        - firstName
        - lastName
        - email
        - role
    UserResponse:
      type: object
      properties:
        id:
          type: number
          example: 1
        email:
          type: string
          example: user@example.com
        createdAt:
          format: date-time
          type: string
          example: "2024-01-15T12:00:00Z"
        updatedAt:
          format: date-time
          type: string
          example: "2024-01-15T12:00:00Z"
        userProfile:
          $ref: "#/components/schemas/UserProfileResponse"
      required:
        - id
        - email
        - createdAt
        - updatedAt
        - userProfile
    EUserState:
      type: string
