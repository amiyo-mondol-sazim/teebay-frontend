info:
  title: Teebay API
  description: The Backend API for Teebay
  version: '1.0'
  contact: {}
tags: []
servers: []
components:
  securitySchemes:
    bearer:
      scheme: bearer
      bearerFormat: JWT
      type: http
  schemas:
    EAllowedMimeTypes:
      type: string
      enum:
        - application/pdf
        - image/png
        - image/jpg
        - image/jpeg
        - image/webp
    PresignedUrlFile:
      type: object
      properties:
        type:
          allOf:
            - $ref: '#/components/schemas/EAllowedMimeTypes'
        maxSize:
          type: number
          maximum: 5242880
          minimum: 1
          example: 5242880
        name:
          type: string
      required:
        - type
        - maxSize
        - name
    PresignedUrlFileDto:
      type: object
      properties:
        files:
          minItems: 1
          type: array
          items:
            $ref: '#/components/schemas/PresignedUrlFile'
      required:
        - files
    PresignedUrlResponse:
      type: object
      properties:
        type:
          allOf:
            - $ref: '#/components/schemas/EAllowedMimeTypes'
        maxSize:
          type: number
          maximum: 5242880
          minimum: 1
          example: 5242880
        name:
          type: string
        signedUrl:
          type: string
      required:
        - type
        - maxSize
        - name
        - signedUrl
    EUserRole:
      type: string
      enum:
        - SUPER_USER
        - ADMIN
        - USER
    TokenizedUser:
      type: object
      properties:
        id:
          type: number
          example: 1
        claimId:
          type: number
          example: 1
        claim:
          example: ADMIN
          allOf:
            - $ref: '#/components/schemas/EUserRole'
        userProfileId:
          type: number
          example: 1
        email:
          type: string
          example: user@example.com
      required:
        - id
        - claimId
        - claim
        - userProfileId
        - email
    UserProfileDto:
      type: object
      properties:
        firstName:
          type: string
          minLength: 2
          maxLength: 255
          example: John
        lastName:
          type: string
          minLength: 2
          maxLength: 255
          example: Doe
        roleId:
          type: number
          example: 1
      required:
        - firstName
        - lastName
        - roleId
    RegisterUserDto:
      type: object
      properties:
        email:
          type: string
          format: email
          example: user@example.com
        password:
          type: string
          minLength: 8
          example: password123
        userProfile:
          $ref: '#/components/schemas/UserProfileDto'
      required:
        - email
        - userProfile
    RoleResponse:
      type: object
      properties:
        id:
          type: number
          example: 1
        createdAt:
          format: date-time
          type: string
          example: '2024-01-15T12:00:00Z'
        updatedAt:
          format: date-time
          type: string
          example: '2024-01-15T12:00:00Z'
        name:
          type: string
          example: ADMIN
      required:
        - id
        - createdAt
        - updatedAt
        - name
    UserProfileResponse:
      type: object
      properties:
        id:
          type: number
          example: 1
        createdAt:
          format: date-time
          type: string
          example: '2024-01-15T12:00:00Z'
        updatedAt:
          format: date-time
          type: string
          example: '2024-01-15T12:00:00Z'
        firstName:
          type: string
          example: John
        lastName:
          type: string
          example: Doe
        email:
          type: string
          example: john.doe@example.com
        role:
          $ref: '#/components/schemas/RoleResponse'
      required:
        - id
        - createdAt
        - updatedAt
        - firstName
        - lastName
        - email
        - role
    UserResponse:
      type: object
      properties:
        id:
          type: number
          example: 1
        email:
          type: string
          example: user@example.com
        createdAt:
          format: date-time
          type: string
          example: '2024-01-15T12:00:00Z'
        updatedAt:
          format: date-time
          type: string
          example: '2024-01-15T12:00:00Z'
        userProfile:
          $ref: '#/components/schemas/UserProfileResponse'
      required:
        - id
        - email
        - createdAt
        - updatedAt
        - userProfile
    EUserState:
      type: string
      enum:
        - UNREGISTERED
        - ACTIVE
        - INACTIVE
    UpdateUserAsSuperuserDto:
      type: object
      properties:
        password:
          type: string
          minLength: 8
          example: password123
        state:
          example: ACTIVE
          allOf:
            - $ref: '#/components/schemas/EUserState'
        roleId:
          type: number
          example: 1
    SuperuserUserResponse:
      type: object
      properties:
        id:
          type: number
          example: 1
        email:
          type: string
          example: user@example.com
        createdAt:
          format: date-time
          type: string
          example: '2024-01-15T12:00:00Z'
        updatedAt:
          format: date-time
          type: string
          example: '2024-01-15T12:00:00Z'
        userProfile:
          $ref: '#/components/schemas/UserProfileResponse'
        state:
          allOf:
            - $ref: '#/components/schemas/EUserState'
      required:
        - id
        - email
        - createdAt
        - updatedAt
        - userProfile
        - state
    PaginationMetadataResponse:
      type: object
      properties:
        currentPage:
          type: number
        itemsPerPage:
          type: number
        totalItems:
          type: number
        totalPages:
          type: number
        hasNextPage:
          type: boolean
        hasPreviousPage:
          type: boolean
      required:
        - currentPage
        - itemsPerPage
        - totalItems
        - totalPages
        - hasNextPage
        - hasPreviousPage
    SuperuserFindAllUserResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/SuperuserUserResponse'
        meta:
          $ref: '#/components/schemas/PaginationMetadataResponse'
      required:
        - data
        - meta
    RolesWithUsersCount:
      type: object
      properties:
        role:
          $ref: '#/components/schemas/RoleResponse'
        activeUsersCount:
          type: number
          example: 5
        inactiveUsersCount:
          type: number
          example: 2
      required:
        - role
        - activeUsersCount
        - inactiveUsersCount
    PermissionResponse:
      type: object
      properties:
        id:
          type: number
        createdAt:
          format: date-time
          type: string
        updatedAt:
          format: date-time
          type: string
        name:
          type: string
      required:
        - id
        - createdAt
        - updatedAt
        - name
    RolesWithUsersAndPermissionsResponse:
      type: object
      properties:
        roles:
          type: array
          items:
            $ref: '#/components/schemas/RolesWithUsersCount'
        permissions:
          type: array
          items:
            $ref: '#/components/schemas/PermissionResponse'
      required:
        - roles
        - permissions
    UpdateRolesPermissionsDto:
      type: object
      properties:
        roleId:
          type: number
          example: 1
        permissionsToRemoveIds:
          type: array
          items:
            required: true
            example:
              - 1
              - 2
            type: array
            items:
              type: number
        permissionsToAddIds:
          type: array
          items:
            required: true
            example:
              - 3
              - 4
            type: array
            items:
              type: number
      required:
        - roleId
        - permissionsToRemoveIds
        - permissionsToAddIds
    UpdateUserProfileDto:
      type: object
      properties:
        firstName:
          type: string
          minLength: 2
          maxLength: 255
          example: John
        lastName:
          type: string
          minLength: 2
          maxLength: 255
          example: Doe
    VerifyByTokenResponse:
      type: object
      properties:
        message:
          type: string
          example: Verification successful
      required:
        - message
    EVerificationRequestStatus:
      type: string
      enum:
        - ACTIVE
        - EXPIRED
    EVerificationRequestType:
      type: string
      enum:
        - EMAIL_VERIFICATION
        - RESET_PASSWORD
    VerificationRequestResponse:
      type: object
      properties:
        id:
          type: number
          example: 1
        createdAt:
          format: date-time
          type: string
          example: '2024-01-15T12:00:00Z'
        updatedAt:
          format: date-time
          type: string
          example: '2024-01-15T12:00:00Z'
        token:
          type: string
          example: token_abc_123
        status:
          example: ACTIVE
          allOf:
            - $ref: '#/components/schemas/EVerificationRequestStatus'
        type:
          example: EMAIL_VERIFICATION
          allOf:
            - $ref: '#/components/schemas/EVerificationRequestType'
        user:
          type: object
          properties:
            id:
              type: number
          required:
            - id
      required:
        - id
        - createdAt
        - updatedAt
        - token
        - status
        - type
        - user
    EProductStatus:
      type: string
      enum:
        - AVAILABLE
        - SOLD
        - RENTED
    Object:
      type: object
      properties: {}
    ERentalPeriod:
      type: string
      enum:
        - DAY
        - WEEK
        - MONTH
    User:
      type: object
      properties: {}
    ProductResponse:
      type: object
      properties:
        id:
          type: number
        title:
          type: string
        description:
          type: string
        categories:
          type: array
          items:
            type: string
        purchasePrice:
          type: number
        rentPrice:
          type: number
        rentalPeriod:
          allOf:
            - $ref: '#/components/schemas/ERentalPeriod'
        status:
          allOf:
            - $ref: '#/components/schemas/EProductStatus'
        viewCount:
          type: number
        imageUrl:
          type: string
        owner:
          $ref: '#/components/schemas/User'
        createdAt:
          format: date-time
          type: string
        updatedAt:
          format: date-time
          type: string
      required:
        - id
        - title
        - description
        - categories
        - purchasePrice
        - rentPrice
        - rentalPeriod
        - status
        - viewCount
        - createdAt
        - updatedAt
    ProductsListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/ProductResponse'
        meta:
          $ref: '#/components/schemas/PaginationMetadataResponse'
      required:
        - data
        - meta
    CreateProductDto:
      type: object
      properties:
        title:
          type: string
          example: Product title
        description:
          type: string
          example: Product description
        categories:
          example:
            - category1
            - category2
          type: array
          items:
            type: string
        purchasePrice:
          type: number
          minimum: 0
          example: 100
        rentPrice:
          type: number
          minimum: 0
          example: 10
        rentalPeriod:
          example: DAY
          allOf:
            - $ref: '#/components/schemas/ERentalPeriod'
        imageUrl:
          type: string
          example: http://localhost:4566/project-dev-bucket/products/abc-123.jpg
      required:
        - title
        - description
        - categories
        - purchasePrice
        - rentPrice
        - rentalPeriod
    UpdateProductDto:
      type: object
      properties:
