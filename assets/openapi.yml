          $ref: '#/components/schemas/Metrics'

    CashbackRule:
      type: [object, 'null']
      description: 'Required for non-draft offers. Optional for draft offers.'
      properties:
        id:
          type: integer
        offer_id:
          type: integer
        cashback_type:
          type: string
          enum:
            - fixed
            - percentage
            - tiered
        cashback_config:
          $ref: '#/components/schemas/CashbackRuleConfig'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    Cashback:
      type: object
      properties:
        id:
          type: integer
          description: Unique identifier for the cashback
          example: 1
        transaction_id:
          type: string
          description: Unique transaction identifier
          example: 'TXN-00000001'
        customer_original_id:
          type: string
          description: Customer identifier from the original system
          example: 'CUST-00000001'
        transaction_amount:
          type: string
          description: Amount of the original transaction
          example: '100.00'
        cashback_amount:
          type: string
          description: Amount of cashback earned
          example: '10.00'
        status:
          type: string
          enum:
            - pending_approval
            - approved
            - declined
          description: Current status of the cashback
          example: 'pending_approval'
        tenant_id:
          type: integer
          description: Tenant ID that this cashback belongs to
          example: 123
        offer:
          type: object
          properties:
            id:
              type: integer
              example: 1
            name:
              type: string
              example: 'Test Offer'
            description:
              type: string
              example: 'This is a test offer description'
            merchant_name:
              type: string
              example: 'Merchant 1'
        cashback_feedback:
          type: [object, 'null']
          description: Feedback associated with this cashback, if any
          properties:
            id:
              type: integer
              example: 1
            feedback:
              type: string
              description: The feedback message
              example: 'Customer complaint about cashback calculation'
            feedback_type:
              type: string
              enum:
                - wrong_calculation
                - refunded
              example: 'wrong_calculation'
            created_at:
              type: string
              format: date-time
        created_at:
          type: string
          format: date-time
          description: When the cashback was created
        updated_at:
          type: string
          format: date-time
          description: When the cashback was last updated

    Metrics:
      type: object
      description: 'Per-offer metrics for this specific offer'
      properties:
        revenue_generated:
          type: number
          minimum: 0
          description: 'Total revenue generated from this offer'
          example: 1500.0
        redemptions_count:
          type: integer
          minimum: 0
          description: 'Number of redemptions for this offer'
          example: 15
        budget_used:
          type: number
          minimum: 0
          description: 'Total budget used for this offer'
          example: 150.0

    CashbackFeedback:
      type: object
      properties:
        id:
          type: integer
          description: Unique identifier for the feedback
          example: 1
        feedback_type:
          type: string
          enum:
            - wrong_calculation
            - refunded
          description: Type of feedback submitted
          example: 'wrong_calculation'
        feedback:
          type: string
          description: The feedback message
          example: 'The cashback amount calculated seems incorrect. I was expecting $15.00 but received $10.00.'
        created_at:
          type: string
          format: date-time
          description: When the feedback was created
          example: '2024-01-15T10:30:00Z'

    OfferAttachment:
      type: object
      required:
        - id
        - attachment_type
        - image_url
        - image_filename
        - image_content_type
        - image_byte_size
      properties:
        id:
          type: integer
        attachment_type:
          type: string
          enum:
            - banner
            - promotional
            - logo
          description: Type of attachment
          example: 'banner'
        image_url:
          type: string
          description: URL to the attached image
          example: '/rails/active_storage/blobs/.../logo.png'
        image_filename:
          type: string
          description: Original filename of the attached image
          example: 'logo.png'
        image_content_type:
          type: string
          description: MIME type of the attached image
          example: 'image/png'
        image_byte_size:
          type: integer
          description: Size of the attached image in bytes
          example: 1024

    CashbackRuleConfig:
      oneOf:
        - type: object
          required:
            - cashback_amount
            - minimum_transaction_value
          properties:
            cashback_amount:
              type: number
              description: Fixed cashback amount in currency units
              example: 10.50
            minimum_transaction_value:
              type: number
              description: Minimum transaction value required to earn cashback
              example: 100.00
        - type: object
          required:
            - cashback_percentage
            - maximum_cashback_value
          properties:
            cashback_percentage:
              type: number
              minimum: 0
              maximum: 100
              description: Cashback percentage (e.g., 5.0 for 5%)
              example: 5.0
            maximum_cashback_value:
              type: number
              description: Maximum cashback value that can be earned
              example: 50.00
        - type: array
          description: Array of spending tiers with corresponding cashback percentages
          items:
            type: object
            required:
              - spending_tier
              - cashback_percentage
            properties:
              spending_tier:
                type: number
                description: Minimum spending amount for this tier
                example: 100.00
              cashback_percentage:
                type: number
                minimum: 0
                maximum: 100
                description: Cashback percentage for this tier (e.g., 2.0 for 2%)
                example: 2.0
          example:
            - spending_tier: 100.00
              cashback_percentage: 2.0
            - spending_tier: 500.00
              cashback_percentage: 5.0
            - spending_tier: 1000.00
              cashback_percentage: 10.0

    pagination:
      type: object
      properties:
        current_page:
          type: integer
        next_page:
          type: [integer, 'null']
        previous_page:
          type: [integer, 'null']
        total_pages:
          type: integer
        per_page:
          type: integer
        total_entries:
          type: integer

